name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests and API checks
        run: ./gradlew --no-daemon sdkTest apiCheckAll

      - name: Build release artifacts
        run: >-
          ./gradlew --no-daemon
          :sdk:core:assembleSimlaRelease
          :sdk:core:assembleRetailcrmRelease
          :sdk:core-okhttp:assembleSimlaRelease
          :sdk:core-okhttp:assembleRetailcrmRelease
          :sdk:consultant:assembleSimlaRelease
          :sdk:consultant:assembleRetailcrmRelease
          :sdk:tracker:assembleSimlaRelease
          :sdk:tracker:assembleRetailcrmRelease
          :sdk:recommendations:assembleSimlaRelease
          :sdk:recommendations:assembleRetailcrmRelease
          :sdk:push-firebase:assembleSimlaRelease
          :sdk:push-firebase:assembleRetailcrmRelease
          :sdk:bom:build
